  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trt_incidents
          POSTGRES_USER: trt_user
          POSTGRES_PASSWORD: trt_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trt_user -d trt_incidents"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: broadcast-incident-management

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/trt_incidents
          SPRING_DATASOURCE_USERNAME: trt_user
          SPRING_DATASOURCE_PASSWORD: trt_password
        run: ./mvnw clean verify
