spring.application.name=broadcast-incident-management

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trt_incidents}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:trt_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:trt_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.test-connection=false
spring.mail.properties.mail.debug=true

app.url=${APP_URL:http://localhost:3000}